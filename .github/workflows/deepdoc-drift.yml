# DeepDoc Go-port drift gate.
#
# Three-way parity contract for the det / DLA / TSR / OCR-rec ports:
#   1. Python oracle (ref_*.py, which import the *real* deepdoc package) is the
#      source of truth.
#   2. A pinned golden JSON (committed under internal/deepdoc/dla-native/testdata)
#      captures the oracle output on a fixed fixture set.
#   3. The Go port is compared against the same golden by the integration tests.
#
# This workflow enforces the *Python* half of that contract automatically:
#   - python-drift:        re-runs the Python oracle on every committed fixture and
#                          compares it to the pinned golden (check_drift.py). If
#                          deepdoc's Python logic changes without the golden being
#                          regenerated, this fails and alerts.
#   - go-dla-native:       runs the dla-native model-backed integration tests
#                          (Go vs the same golden) for DLA/TSR/OCR-rec/det on a
#                          portable runner (ORT only, no CGO PDF static libs).
#
# det is exercised in go-dla-native (and go-dla-native-gocv) purely as a
# Golden-comparison tool (RunDet vs the Python reference), NOT as a
# production-wired path — there is no parser/pdf native_det seam.
name: deepdoc-drift
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'deepdoc/**'
      - 'common/**'
      - 'rag/**'
      - 'internal/deepdoc/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'deepdoc/**'
      - 'common/**'
      - 'rag/**'
      - 'internal/deepdoc/**'
  # Nightly: catches upstream deepdoc logic drift even when no repo file changed.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_REPO: InfiniFlow/deepdoc
  MODEL_FILES: "det.onnx layout.onnx tsr.onnx rec.onnx ocr.res"
  PYTHON_VERSION: '3.13'
  GO_VERSION: '1.26'

jobs:
  python-drift:
    name: python-oracle drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv package store
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-deepdoc-drift-${{ runner.os }}-${{ env.PYTHON_VERSION }}

      - name: Cache DeepDoc models
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models/deepdoc
          key: deepdoc-models-${{ env.MODEL_REPO }}-v1

      - name: Provision environment + models
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
        run: |
          uv sync --python ${{ env.PYTHON_VERSION }} --frozen
          # huggingface_hub is a transitive dep of deepdoc; ensure it for model pulls.
          uv pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          uv run python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ["MODEL_REPO"]
          out = os.environ["MODEL_DIR"]
          for f in os.environ["MODEL_FILES"].split():
              hf_hub_download(repo_id=repo, filename=f, local_dir=out)
          print("models ready:", sorted(os.listdir(out)))
          PY

      - name: Run drift gate (Python oracle vs pinned golden)
        working-directory: internal/deepdoc/dla-native
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
          # The ref_*.py oracles do `from deepdoc.vision.ocr import ...`; the
          # deepdoc package lives at the repo root, which uv sync does not
          # install into the venv. Point PYTHONPATH at the workspace root so the
          # import resolves (matches check_drift.py's documented local invocation).
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python check_drift.py

  go-dla-native:
    name: go DLA/TSR/OCR-rec/det integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install ORT shared lib (CPU)
        id: ort
        run: |
          python3 -m pip install --quiet "onnxruntime==1.23.2"
          echo "ORT_LIB=$(python3 -c 'import glob,onnxruntime,os;d=os.path.join(os.path.dirname(onnxruntime.__file__),"capi");c=[f for f in glob.glob(os.path.join(d,"libonnxruntime.so*")) if "providers" not in f][0];print(c)')" >> "$GITHUB_OUTPUT"

      - name: Cache DeepDoc models
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models/deepdoc
          key: deepdoc-models-${{ env.MODEL_REPO }}-v1

      - name: Provision models
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
        run: |
          python3 -m pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          python3 - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ["MODEL_REPO"]
          out = os.environ["MODEL_DIR"]
          for f in os.environ["MODEL_FILES"].split():
              hf_hub_download(repo_id=repo, filename=f, local_dir=out)
          PY

      - name: Run dla-native integration tests (Go vs pinned golden)
        working-directory: internal/deepdoc/dla-native
        env:
          ORT_LIB: ${{ steps.ort.outputs.ORT_LIB }}
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
          CGO_ENABLED: '1'
        run: go test -tags integration -count=1 ./native/

  # gocv build: the cv2 decode/resize path that reaches 1:1 parity with the
  # Python reference (the pure-Go build in go-dla-native carries a ~2.6px
  # decode/resize floor). This is D2·gocv from HANDOFF.md. OpenCV 4.10 is built
  # once into a cached prefix keyed on the version. Now a blocking gate: the
  # pkg-config provisioning bug is fixed, so a gocv regression must block.
  go-dla-native-gocv:
    name: go DLA/TSR/OCR-rec/det integration (gocv / OpenCV 4.10)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install ORT shared lib (CPU)
        id: ort
        run: |
          python3 -m pip install --quiet "onnxruntime==1.23.2"
          echo "ORT_LIB=$(python3 -c 'import glob,onnxruntime,os;d=os.path.join(os.path.dirname(onnxruntime.__file__),"capi");c=[f for f in glob.glob(os.path.join(d,"libonnxruntime.so*")) if "providers" not in f][0];print(c)')" >> "$GITHUB_OUTPUT"

      - name: Cache OpenCV 4.10 build
        id: ocv-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/opencv-4.10
          key: opencv-4.10.0-${{ runner.os }}

      - name: Build OpenCV 4.10 (skip on cache hit)
        env:
          OPENCV_VERSION: '4.10.0'
          OCV_PREFIX: ${{ runner.workspace }}/opencv-4.10
        run: |
          set -e
          PC="$OCV_PREFIX/lib/pkgconfig/opencv4.pc"
          if [ -f "$PC" ]; then
            echo "OpenCV cache hit at $OCV_PREFIX"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config unzip curl git wget
          TMP="$(mktemp -d)"
          curl -Lo "$TMP/opencv.zip" "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.zip"
          unzip -q "$TMP/opencv.zip" -d "$TMP"
          mkdir -p "$TMP/opencv-${OPENCV_VERSION}/build"
          cd "$TMP/opencv-${OPENCV_VERSION}/build"
          cmake -D CMAKE_BUILD_TYPE=RELEASE \
                -D CMAKE_INSTALL_PREFIX="$OCV_PREFIX" \
                -D BUILD_SHARED_LIBS=ON \
                -D BUILD_DOCS=OFF -D BUILD_EXAMPLES=OFF \
                -D BUILD_TESTS=OFF -D BUILD_PERF_TESTS=OFF \
                -D BUILD_opencv_java=NO -D BUILD_opencv_python=NO \
                -D BUILD_opencv_python2=NO -D BUILD_opencv_python3=NO \
                -D WITH_JASPER=OFF -D OPENCV_GENERATE_PKGCONFIG=ON ..
          make -j "$(nproc)"
          make install
          # Verify opencv4.pc is resolvable where the run step expects it. The
          # run step exports PKG_CONFIG_PATH, but this verification must point
          # pkg-config at the install prefix itself or it searches the default
          # path and reports "Package opencv4 was not found", failing the build
          # step and skipping the test step.
          export PKG_CONFIG_PATH="$OCV_PREFIX/lib/pkgconfig"
          pkg-config --modversion opencv4

      - name: Cache DeepDoc models
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models/deepdoc
          key: deepdoc-models-${{ env.MODEL_REPO }}-v1

      - name: Provision models
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
        run: |
          python3 -m pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          python3 - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ["MODEL_REPO"]
          out = os.environ["MODEL_DIR"]
          for f in os.environ["MODEL_FILES"].split():
              hf_hub_download(repo_id=repo, filename=f, local_dir=out)
          PY

      - name: Run dla-native integration tests (gocv build)
        working-directory: internal/deepdoc/dla-native
        env:
          ORT_LIB: ${{ steps.ort.outputs.ORT_LIB }}
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ runner.workspace }}/opencv-4.10/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.workspace }}/opencv-4.10/lib
        run: go test -tags "integration gocv" -count=1 ./native/
