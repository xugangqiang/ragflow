# DeepDoc Go-port drift gate.
#
# Three-way parity contract for the det / DLA / TSR / OCR-rec ports:
#   1. Python oracle (ref_*.py, which import the *real* deepdoc package) is the
#      source of truth.
#   2. A pinned golden JSON (committed under internal/deepdoc/native/testdata)
#      captures the oracle output on a fixed fixture set.
#   3. The Go port is compared against the same golden by the integration tests.
#
# This workflow enforces the *Python* half of that contract automatically:
#   - python-drift:        re-runs the Python oracle on every committed fixture and
#                          compares it to the pinned golden (check_drift.py). If
#                          deepdoc's Python logic changes without the golden being
#                          regenerated, this fails and alerts.
#   - go-native:       runs the native model-backed integration tests
#                          (Go vs the same golden) for DLA/TSR/OCR-rec/det on a
#                          portable runner. ORT is statically linked into the
#                          test binary and resolved via dlopen(self), so no
#                          libonnxruntime.so is needed; the CGO PDF static libs
#                          (office_oxide/pdfium/pdf_oxide) are NOT provisioned.
#
# det is exercised in go-native purely as a Golden-comparison tool
# (RunDet vs the Python reference). The model-backed DLA/TSR/OCR-rec/det tests
# here run against native directly (statically-linked ORT, no CGO PDF static
# libs) to keep this portable runner fast. The production-wired path — the
# in-process DeepDoc backend registered into the parser via
# SetNativeDocAnalyzerFactory under the cgo build tag — is covered separately
# by the server smoke test and the cgo integration tier, which additionally
# provision the static PDF libs (office_oxide/pdfium/pdf_oxide) and lld.
name: deepdoc-drift
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'deepdoc/**'
      - 'common/**'
      - 'rag/**'
      - 'internal/deepdoc/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'deepdoc/**'
      - 'common/**'
      - 'rag/**'
      - 'internal/deepdoc/**'
  # Nightly: catches upstream deepdoc logic drift even when no repo file changed.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_REPO: InfiniFlow/deepdoc
  # mirrors internal/common.DeepDocModelFiles (Go in-process backend).
  MODEL_FILES: "det.onnx layout.onnx tsr.onnx rec.onnx ocr.res"
  PYTHON_VERSION: '3.13'
  GO_VERSION: '1.26'

jobs:
  python-drift:
    name: python-oracle drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv package store
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-deepdoc-drift-${{ runner.os }}-${{ env.PYTHON_VERSION }}

      - name: Cache DeepDoc models
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models/deepdoc
          key: deepdoc-models-${{ env.MODEL_REPO }}-v1

      - name: Provision environment + models
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
        run: |
          uv sync --python ${{ env.PYTHON_VERSION }} --frozen
          # huggingface_hub is a transitive dep of deepdoc; ensure it for model pulls.
          uv pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          uv run python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ["MODEL_REPO"]
          out = os.environ["MODEL_DIR"]
          for f in os.environ["MODEL_FILES"].split():
              hf_hub_download(repo_id=repo, filename=f, local_dir=out)
          print("models ready:", sorted(os.listdir(out)))
          PY

      - name: Link models into deepdoc default model dir
        # The DLA/TSR oracles (ref_dla.py / ref_tsr.py) call deepdoc's own
        # LayoutRecognizer4YOLOv10 / TableStructureRecognizer, which load models
        # from deepdoc's *default* directory (get_project_base_directory() +
        # rag/res/deepdoc) rather than from MODEL_DIR. Symlink that default dir
        # at the repo root to the HF-downloaded models so the real-deepdoc
        # oracles resolve without code changes. (rag/res is gitignored, so this
        # symlink is ephemeral per CI run.)
        run: |
          mkdir -p rag/res
          ln -sfn "${{ github.workspace }}/models/deepdoc" rag/res/deepdoc

      - name: Run drift gate (Python oracle vs pinned golden)
        working-directory: internal/deepdoc/native
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
          # The ref_*.py oracles do `from deepdoc.vision.ocr import ...`; the
          # deepdoc package lives at the repo root, which uv sync does not
          # install into the venv. Point PYTHONPATH at the workspace root so the
          # import resolves (matches check_drift.py's documented local invocation).
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python check_drift.py

  go-native:
    name: go DLA/TSR/OCR-rec/det integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install lld (static-link ORT)
        run: sudo apt-get update -qq && sudo apt-get install -y lld

      - name: Download ORT static archives
        # Statically link libonnxruntime into the test binary (mirrors
        # build.sh: ONNX_RUNTIME_STATIC_DIR). OrtGetApiBase is then resolved
        # via dlopen(self), so no libonnxruntime.so is needed at runtime.
        run: |
          ORT_VERSION=1.23.2
          URL="https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-static_lib-${ORT_VERSION}-glibc2_28.zip"
          DEST="$HOME/ragflow-native-libs/onnxruntime/static_lib"
          mkdir -p "$DEST"
          curl -fsSL "$URL" -o /tmp/ort_static.zip
          (cd "$DEST" && unzip -o -q /tmp/ort_static.zip)
          echo "ORT static archives:"; find "$DEST" -name '*.a'

      - name: Cache DeepDoc models
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/models/deepdoc
          key: deepdoc-models-${{ env.MODEL_REPO }}-v1

      - name: Provision models
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
        run: |
          python3 -m pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          python3 - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ["MODEL_REPO"]
          out = os.environ["MODEL_DIR"]
          for f in os.environ["MODEL_FILES"].split():
              hf_hub_download(repo_id=repo, filename=f, local_dir=out)
          PY

      - name: Run native integration tests (Go vs pinned golden)
        env:
          MODEL_DIR: ${{ github.workspace }}/models/deepdoc
          CGO_ENABLED: '1'
        run: |
          ORT_STATIC="$HOME/ragflow-native-libs/onnxruntime/static_lib"
          # Skip GPU-only providers we never build against.
          ORT_A=$(find "$ORT_STATIC" -type f -name '*.a' \
                    ! -name '*cuda*' ! -name '*tensorrt*' \
                    ! -name '*coreml*' ! -name '*dml*' ! -name '*migraphx*' \
                    | tr '\n' ' ')
          export CGO_LDFLAGS="-Wl,--whole-archive ${ORT_A} -Wl,--no-whole-archive -Wl,--export-dynamic -fuse-ld=lld -lstdc++"
          echo "CGO_LDFLAGS=$CGO_LDFLAGS"
          go test -tags "cgo integration" -count=1 ./internal/deepdoc/native/...
